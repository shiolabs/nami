# Catalog packages that are more than an app on nami's computer (a daemon,
# a group, settings): importing one into the computer's file includes the
# nami file for it (layers/<file>.nami), which brings the package.
features:
  docker: docker
  docker-compose: docker
  docker-buildx: docker
  tailscale: tailscale

# Groups that come with a nami file: someone in one on the old computer is
# in it on nami's (os.users' `groups:`), when that file is included.
feature-groups:
  docker: docker
