# What a project's build asks for, next to the catalog's names: for
# `nami recipe from-url` (what its build files ask for) and for what a
# failed build says is missing. A name not here is still looked for, by
# the names nixpkgs would give it, each checked against the binary
# cache's listing of the package's files (the header, the .pc file, the
# library). `~` means every build has it already (the C library, the
# compiler), so there's nothing to add. Libraries by file (`-lfoo`) are
# in deb_names.yaml's sonames.

