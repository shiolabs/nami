# Ubuntu's names next to nixpkgs', for `nami recipe from-deb`. A name not
# here is still looked for: a library by its file in the binary cache, a
# package by names nixpkgs would give it. `~` means every build has it
# already (glibc, the C library), so there's nothing to add.

# Shared libraries (what readelf calls NEEDED) -> the nixpkgs package
# with that file; `attr.lib` picks its lib output.
