[package]
name = "nami"
version = "0.22.3"
edition = "2021"
description = "Declarative, distro-independent package manager on top of the nixpkgs binary cache. No Nix required."
license = "MIT"

[dependencies]
age = { version = "0.11", features = ["armor", "ssh"] }
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "2"
flate2 = "1"
libc = "0.2"
rsa = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml = "0.9"
sha2 = "0.10"
toml = "0.8"
# The YAML parser serde_yaml uses, for where each value is written (yaml_text.rs).
unsafe-libyaml = "0.2"
ureq = { version = "2", default-features = false, features = ["tls"] }
xz2 = { version = "0.1", features = ["static"] }
# Without the decoders of zstd's formats from before 2016 (v0.1 to v0.7): nothing
# nami reads is in them, and every bundle's runtime is smaller.
zstd = { version = "0.13", default-features = false, features = ["arrays"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
